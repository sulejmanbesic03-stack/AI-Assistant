name: Build AI Assistant

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "AI Assistant/AI Assistant.csproj"

      - name: Build
        run: dotnet build "AI Assistant/AI Assistant.csproj" --configuration Release --no-restore
