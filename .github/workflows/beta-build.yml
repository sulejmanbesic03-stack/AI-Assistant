name: Beta Build

on:
  push:
    branches:
      - beta/ship-v1
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "AI Assistant/AI Assistant.csproj"

      - name: Build Release
        run: dotnet build "AI Assistant/AI Assistant.csproj" -c Release --no-restore
